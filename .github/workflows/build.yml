name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para publicar la compilación como Release

jobs:
  build:
    name: Compilar y probar
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Versión de Xcode
        run: xcodebuild -version && swift --version

      - name: Pruebas (Swift Package Manager)
        run: swift test

      # El proyecto de Xcode se genera desde Sources/, así incluye los archivos
      # nuevos del fork sin tocar el .xcodeproj del autor original.
      - name: Regenerar el proyecto de Xcode
        run: |
          gem install --user-install xcodeproj
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby Scripts/generate_xcode_project.rb

      - name: Compilar la app (Release, sin firmar)
        run: |
          xcodebuild \
            -project Freeloader.xcodeproj \
            -target Freeloader \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Número de compilación, firma y paquete
        env:
          SIGN_P12: ${{ secrets.SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          APP=build/Release/Explorer.app
          /usr/libexec/PlistBuddy -c "Add :FLBuildNumber string ${{ github.run_number }}" "$APP/Contents/Info.plist"
          # Firma con el certificado propio «Explorer Firma» (secreto SIGN_P12): la firma es
          # la misma en todas las compilaciones y macOS conserva los permisos al actualizar.
          # En pull requests no hay secretos: se firma ad hoc.
          if [ -n "$SIGN_P12" ]; then
            KC="$RUNNER_TEMP/firma.keychain-db"
            security create-keychain -p "" "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p "" "$KC"
            echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
            security import "$RUNNER_TEMP/firma.p12" -k "$KC" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-certificate -c "Explorer Firma" -p "$KC" > "$RUNNER_TEMP/firma.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/firma.pem"
            rm -f "$RUNNER_TEMP/firma.p12"
            codesign --force --deep --keychain "$KC" --sign "Explorer Firma" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Explorer.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Explorer-build-${{ github.run_number }}
          path: Explorer.zip
          retention-days: 30

      - name: Publicar Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Explorer.zip \
            --title "Compilación ${{ github.run_number }}" \
            --notes "Compilado desde ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
